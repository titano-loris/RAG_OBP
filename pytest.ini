[pytest]
testpaths = tests_ai
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    evaluation: evaluation de la qualite du modele (fidelite, hallucination, exactitude)
    security: tests adversariaux et de robustesse
    slow: necessite le chargement de Mistral-7B (14 Go, plusieurs minutes)

addopts =
    -v
    --tb=short
    --strict-markers

# Usage :
#   pytest tests_ai/                     -> suite complete (~20-30 min)
#   pytest tests_ai/ -m security         -> securite uniquement
#   pytest tests_ai/ -m evaluation       -> qualite uniquement
#   pytest tests_ai/ --html=reports/eval-report.html --self-contained-html
